<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="ciYoQ8q8xQF2WsnE0Vw29VAtpS7K3TM59imhkjpjFrU"
    />
    <title>درحال ورود به صفحه اصلی - سرباز بازی مرکب</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: rgba(0, 0, 0, 0.882);
        min-height: 100vh;
      }

      .wrapper {
        position: absolute;
        top: 30%;
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 0 16px;
      }

      .card {
        gap: 30px;
        background-color: black;
        width: 100%;
        max-width: 419px;
        padding: 40px 24px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card img {
        width: 100%;
        max-width: 419px;
        height: auto;
      }

      .loading-icon {
        width: 40px;
        height: 40px;
        animation: loading-spin 0.9s linear infinite;
      }

      @keyframes loading-spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 30px 16px;
          gap: 20px;
        }
      }
    </style>
  </head>
  <body dir="rtl">
    <section class="wrapper">
      <div class="card">
        <img src="shared/images/logo/logo-long.png" alt="لوگو" />
        <nav>
          <svg
            class="loading-icon"
            viewBox="0 0 128 128"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient
                id="loadingGradient"
                gradientUnits="userSpaceOnUse"
                x1="64"
                y1="20"
                x2="20"
                y2="64"
              >
                <stop offset="0%" stop-color="#ec4899" stop-opacity="0.08" />
                <stop offset="55%" stop-color="#ec4899" stop-opacity="0.3" />
                <stop offset="85%" stop-color="#ec4899" stop-opacity="0.7" />
                <stop offset="100%" stop-color="#ec4899" stop-opacity="1" />
              </linearGradient>
            </defs>

            <path
              d="M64 20 A44 44 0 1 1 20 64"
              fill="none"
              stroke="url(#loadingGradient)"
              stroke-width="24"
              stroke-linecap="round"
            />
          </svg>
        </nav>
      </div>
    </section>
    <script>
      const language = navigator.language.toLowerCase();
      if (language.startsWith("fa")) {
        window.location.href = "./fa";
      } else {
        window.location.href = "./en";
      }
    </script>
  </body>
</html>
