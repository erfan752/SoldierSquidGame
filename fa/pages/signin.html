<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000" />
    <link rel="icon" href="../../favicon.ico" type="icon" />
    <link rel="stylesheet" href="../css/signin.css" />
    <title>ورود - سرباز بازی مرکب</title>
  </head>
  <body>
    <a href="../index" class="back-home-link" aria-label="بازگشت به صفحه اصلی">
      ← بازگشت به سرباز
    </a>

    <main class="signin-main">
      <section class="signin-card">
        <div class="signin-logo">
          <img
            src="../../shared/images/logo/logo-long.png"
            alt="لوگوی سرباز بازی مرکب"
          />
        </div>

        <form action="#" id="form-elements" class="signin-form">
          <h1 class="signin-title">ورود / ثبت نام</h1>

          <label for="number-input">
            لطفا شناسه خود را وارد کنید

            <div class="id-field-group">
              <div class="id-input-wrapper">
                <input
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  placeholder="شناسه را وارد کنید"
                  id="number-input"
                  required
                />
                <span class="id-prefix">- SDL</span>
              </div>

              <button type="button" id="createId-btn">ساخت شناسه ↻</button>
            </div>
          </label>

          <label for="password-input">
            رمز را وارد کنید

            <div class="password-field-group">
              <input
                type="password"
                id="password-input"
                placeholder="رمز حساب را وارد کنید"
              />

              <button
                type="button"
                id="togglePassword-btn"
                aria-label="نمایش رمز"
              >
                <img
                  src="../../shared/images/icons/soldier-cloase.png"
                  alt=""
                  width="35"
                />
              </button>
            </div>
          </label>

          <input type="submit" value="ورود به حساب سرباز" id="submit-btn" />

          <p class="agreement">
            با ساخت حساب درواقع با
            <a href="#">شرایط استفاده و سیاست حفظ حریم خصوصی</a> موافقت می کنید.
          </p>

          <div id="login-options">
            <p class="help-login">
              در ورود مشکل دارید؟ <a href="#">راهنما را بخوانید</a>
            </p>
            <p class="forget-password">
              <a href="#">رمز را فراموش کرده ام.</a>
            </p>
          </div>
        </form>
      </section>
    </main>
    <div id="register-modal" class="register-modal">
      <div class="register-modal-content">
        <button
          type="button"
          id="close-register-modal"
          class="register-modal-close"
        >
          ×
        </button>

        <h2>ادامه ثبت نام</h2>

        <p>برای ساخت حساب سرباز، اطلاعات زیر را وارد کنید.</p>

        <div class="register-avatar">
          <img
            src="../../shared/images/avatars/456-profile-icon.jpg"
            alt="آواتار 456"
          />
        </div>

        <label for="register-name">
          نام سرباز

          <input
            type="text"
            id="register-name"
            placeholder="نام خود را وارد کنید"
            autocomplete="name"
          />
        </label>

        <label for="register-email">
          ایمیل بازیابی

          <input
            type="email"
            id="register-email"
            placeholder="ایمیل بازیابی را وارد کنید"
            autocomplete="email"
          />
        </label>

        <button type="button" id="register-submit">ساخت حساب</button>
      </div>
    </div>

    <script src="../js/signin.js"></script>
  </body>
</html>
