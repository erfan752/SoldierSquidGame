<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/user.css" />
    <link rel="shortcut icon" href="../favicon.jpg" type="image" />
    <title>داشبورد - سرباز بازی مرکب</title>
  </head>

  <body dir="rtl">
    <header>
      <img src="../assets/images/logo/logo-long.jpg" alt="" />
      <div style="display: inline-block; color: aliceblue">☰</div>
      <nav style="display: none">
        <ul>
          <li>صفحه اصلی</li>
          <li>تعرفه ها</li>
          <li>تورنومنت فینال</li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="account-info">
        <div
          style="display: flex; align-items: center; gap: 20px; padding: 10px"
        >
          <div id="profile"><img src="../assets/images/profile-icon/456-profile-icon.jpg" alt="" /></div>
          <div>
            <h1>داشبورد حساب</h1>
            <div id="account-data">
              <div class="item-data">
                <div>
                  <span>شناسه :</span>
                  <span id="userid">SDL - 1234567</span>
                </div>
                <div>
                  <span><button id="copyId-btn">کپی شناسه</button></span>
                </div>
              </div>
              <div class="item-data">
                <div>
                  <span>رمز عبور :</span>
                  <span>********</span>
                </div>
                <div>
                  <span><button>تغییر رمز عبور</button></span>
                </div>
              </div>
              <div class="item-data">
                <div>
                  <span>ایمیل بازیابی :</span>
                </div>
                <div>
                  <span><button>افزودن ایمیل بازیابی</button></span>
                </div>
              </div>
              <div class="item-data">
                <div>
                  <span>آواتار :</span>
                </div>
                <div>
                  <span><button>تغییر آواتار</button></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="subscriotion-status">
          <span id="no-subscriotion">اشتراک غیرفعال</span>
        </div>
      </section>
      <section>
        <div>
          <div>
            <h2>تاریخچه اشتراک ها</h2>
            <div>
              <button>اشتراک هدیه</button>
              <button>خرید اشتراک</button>
            </div>
          </div>
          <div>
            <table>
              <thead>
                <tr>
                  <th>مدت زمان</th>
                  <th>آیدی گروه</th>
                  <th>آیدی رئیس</th>
                  <th>تاریخ انقضا</th>
                  <th>شناسه خریدار</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div></div>
      </section>
    </main>
    <div id="absolote-card" style="display: none">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <script src="../js/user.js"></script>
  </body>
</html>
