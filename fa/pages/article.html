<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000" />
    <link rel="icon" href="../../favicon.ico" type="icon" />
    <link rel="stylesheet" href="../../shared/css/loading.css" />
    <link rel="stylesheet" href="../css/article.css" />
    <title id="page-title">مقاله - سرباز بازی مرکب</title>
  </head>
  <body>
    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">
      <div class="header-item header-logo">
        <a href="../index" aria-label="صفحه اصلی سرباز">
          <img
            src="../../shared/images/logo/logo-long.png"
            alt="لوگوی رسمی سرباز بازی مرکب"
          />
        </a>
      </div>

      <button
        class="menu-button"
        type="button"
        aria-label="باز کردن منو"
        aria-expanded="false"
        id="menu-toggle-btn"
      >
        <svg
          class="icon-menu"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          width="35"
          height="35"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>

        <svg
          class="icon-close"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          width="30"
          height="30"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>
      </button>
    </header>

    <!-- =========================
         Nav Menu
    ========================== -->
    <div class="nav-overlay" id="nav-overlay" hidden></div>

    <nav class="nav-drawer" id="nav-drawer" aria-label="منوی اصلی">
      <div class="nav-drawer-header">
        <img
          src="../../shared/images/logo/logo-long.png"
          alt="لوگوی سرباز"
          class="nav-drawer-logo"
        />
      </div>

      <ul class="nav-links">
        <li><a href="../index">صفحه اصلی</a></li>
        <li><a href="pricing">تعرفه اشتراک</a></li>
        <li><a href="events">ایونت‌ها</a></li>
        <li><a href="winners">برندگان</a></li>
        <li><a href="user">حساب کاربری</a></li>
      </ul>

      <div class="nav-drawer-footer">
        <a href="signin" class="nav-signin-btn">ورود / ثبت‌نام</a>
      </div>
    </nav>

    <main>

      <!-- =========================
           Article Content
      ========================== -->
      <article class="article-view" id="article-view" hidden>
        <div class="article-cover" id="article-cover">
          <img id="article-cover-img" src="" alt="" />
        </div>

        <div class="article-container">
          <a href="articles" class="back-link"> ← بازگشت به مقاله‌ها </a>

          <span class="article-category" id="article-category"></span>

          <h1 class="article-title" id="article-title"></h1>

          <div class="article-meta">
            <span id="article-author"></span>
            <span class="meta-divider">•</span>
            <time id="article-date"></time>
          </div>

          <div class="article-body" id="article-body">
            <!-- پاراگراف‌ها با JS اضافه می‌شوند -->
          </div>
        </div>
      </article>

      <!-- =========================
           Related Articles
      ========================== -->
      <section class="related-section" id="related-section" hidden>
        <h2>مقاله‌های مرتبط</h2>
        <div class="related-grid" id="related-grid"></div>
      </section>
    </main>

    <!-- =========================
         Footer
    ========================== -->
    <footer id="copyright">
      <nav>کلیه داده‌ها متعلق پروژه سرباز بازی مرکب است. 1405 &copy;</nav>
      <nav>طراحی کل پروژه سرباز بازی مرکب، آقای Erf.</nav>
    </footer>

    <script src="../../shared/js/loading.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/article.js"></script>
  </body>
</html>
